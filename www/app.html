<!DOCTYPE html>

<!-- v2.6 - crisis protocol, sync status, progress report, 4-week program, install prompt, research opt-in -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<div id="landscape-bg" aria-hidden="true"></div>
<!-- Moon overlay (night only) -->
<div id="moon-overlay">
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="moonGlow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="80" cy="80" r="70" fill="#f6f4ee"/>
  <circle cx="80" cy="80" r="58" fill="#fcfbf6"/>
  <circle cx="66" cy="72" r="11" fill="#e4ded2" opacity=".30"/>
  <circle cx="96" cy="90" r="8" fill="#e4ded2" opacity=".22"/>
  <circle cx="74" cy="99" r="6" fill="#e4ded2" opacity=".26"/>
</svg>
</div>
<!-- hidden defs referenced by in-app character SVGs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="star4" d="M0,-1 Q0.25,-0.25 1,0 Q0.25,0.25 0,1 Q-0.25,0.25 -1,0 Q-0.25,-0.25 0,-1 Z"/>
    <filter id="starGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>
<div id="toast-container" aria-live="polite" role="status"></div>
<div id="conn-status" style="position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:199;pointer-events:none;display:none"><span style="display:inline-block;padding:4px 12px;border-radius:6px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15)">&#x26A0; No connection</span></div>
<a class="skip-link" href="#app" onclick="document.getElementById('app').focus()">Skip to main content</a>
<div class="top-bar">
  <div style="display:flex;align-items:center;gap:8px"><div class="globe-logo" role="heading" aria-level="1"><img src="globe-icon.png" alt="" width="32" height="32" aria-hidden="true"></div><div><div class="logo-text" role="heading" aria-level="1">Re.<span style="color:var(--primary)">Claim</span></div><div id="journey-header" class="journey-header"></div></div></div>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="sync-indicator" class="sync-indicator" onclick="if(_syncStatus==='error'){syncToFirestore()}" style="display:none" title="Sync status" role="status" aria-live="polite">?</span>
    <button class="sos-btn-float" onclick="showSOS()" title="SOS - Get help now" aria-label="SOS - Get help now">SOS</button>
    <button class="profile-btn-float" onclick="goTo('profile')" title="Profile" aria-label="Profile"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
  </div>
</div>

<main class="app" id="app" tabindex="-1" aria-label="Re.Claim app"><div id="app-splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:20px"><img src="globe-icon.png" alt="Re.Claim" style="width:180px;height:180px;border-radius:50%;object-fit:cover;box-shadow:0 8px 32px rgba(45,106,79,.22);margin-bottom:24px"><div style="font-size:36px;font-weight:800;letter-spacing:-1.5px">Re.<span style="color:var(--primary)">Claim</span></div><div style="font-size:13px;color:var(--muted);margin-top:8px;animation:pulse 1.5s ease-in-out infinite">loading...</div></div></main>
<div id="page-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<nav class="tabs" id="tabs" aria-label="Main navigation">
    <button class="tab active" data-page="home" aria-label="Atlas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/><circle cx="12" cy="12" r="2"/></svg><span class="tab-label">Atlas</span>
    </button>
    <button class="tab" data-page="reflect" aria-label="Journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span class="tab-label">Journal</span>
    </button>
    <button class="tab" data-page="care" aria-label="Wellness">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s-8-4.5-8-11.8A3.8 3.8 0 017.8 6.4c1.4 0 2.7.7 3.4 1.8l.8 1.2.8-1.2a4.2 4.2 0 013.4-1.8A3.8 3.8 0 0120 10.2C20 17.5 12 22 12 22z"/></svg><span class="tab-label">Wellness</span>
    </button>
    <button class="tab" data-page="track" aria-label="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span class="tab-label">History</span>
    </button>
    <button class="tab" data-page="more" aria-label="Tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg><span class="tab-label">Tools</span><span id="tools-badge" style="display:none;position:absolute;top:2px;right:50%;margin-right:-22px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:999px;min-width:8px;text-align:center;line-height:1.4" aria-hidden="true">1</span>
    </button>
</nav>
